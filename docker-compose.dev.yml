# Developer override: live-reload backend/worker code without rebuilding images.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  init:
    volumes:
      - ./backend:/app
      - exports:/data/exports
      - ./config:/config:ro
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
      - exports:/data/exports
      - ./config:/config:ro
  worker:
    volumes:
      - ./backend:/app
      - exports:/data/exports
      - ./config:/config:ro
