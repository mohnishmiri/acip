# Azure Cost Intelligence Platform -- local development stack
#   docker compose up --build        -> http://localhost:3000  (API docs: http://localhost:8000/api/docs)
# No Azure credentials are required: DEMO_MODE seeds clearly-labelled synthetic data.
name: acip

x-backend-env: &backend-env
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acip}:${POSTGRES_PASSWORD:-acip_local_dev}@postgres:5432/${POSTGRES_DB:-acip}
  DEMO_MODE: ${DEMO_MODE:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # application user sign-in (Entra ID) -- disabled locally by default
  APP_AUTH_MODE: ${APP_AUTH_MODE:-disabled}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
  ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:-}
  ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
  ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
  # cost collection identity (existing service principal) -- disabled locally by default
  AZURE_AUTH_MODE: ${AZURE_AUTH_MODE:-disabled}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_SUBSCRIPTIONS_CONFIG: ${AZURE_SUBSCRIPTIONS_CONFIG:-}
  AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
  AZURE_COST_EXPORT_CONTAINER: ${AZURE_COST_EXPORT_CONTAINER:-cost-exports}
  EXPORT_SOURCE: ${EXPORT_SOURCE:-auto}
  LOCAL_EXPORT_ROOT: /data/exports
  EXPORT_DISCOVERY_INTERVAL_MINUTES: ${EXPORT_DISCOVERY_INTERVAL_MINUTES:-60}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acip}
      POSTGRES_USER: ${POSTGRES_USER:-acip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acip_local_dev}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acip} -d ${POSTGRES_DB:-acip}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # one-shot: wait for DB, run migrations, seed reference data, register subscriptions, seed demo data
  init:
    build:
      context: ./backend
    image: acip-backend:local
    command: ["python", "-m", "app.cli", "init"]
    environment: *backend-env
    volumes:
      - exports:/data/exports
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: acip-backend:local
    environment: *backend-env
    volumes:
      - exports:/data/exports
      - ./config:/config:ro
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: acip-backend:local
    command: ["python", "-m", "worker.main"]
    environment: *backend-env
    volumes:
      - exports:/data/exports
      - ./config:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: acip-frontend:local
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # automated tests: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    image: acip-backend:test
    command: ["pytest", "-q", "--cov=app", "--cov=worker", "--cov-report=term"]
    environment:
      <<: *backend-env
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acip}:${POSTGRES_PASSWORD:-acip_local_dev}@postgres:5432/acip_test
      DEMO_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  exports:
