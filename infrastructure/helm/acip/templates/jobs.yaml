{{- /*
Migration hook (pre-install / pre-upgrade): runs `alembic upgrade head` BEFORE new pods roll.
Hook resources cannot depend on regular release objects (they do not exist yet on first
install), so the hook brings its own ServiceAccount. DATABASE_URL comes from the Secret synced by
akv2k8s (AzureKeyVaultSecret <fullname>-db, itself a pre-install hook); the pod waits until it exists.
*/ -}}
{{- $fullname := include "acip.fullname" . -}}
{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "acip.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "acip.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "acip.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-migrate
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "acip.image" (dict "ctx" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["python", "-m", "app.cli", "migrate"]
          env:
            - name: LOG_FORMAT
              value: json
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "acip.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if .Values.init.enabled }}
---
# Init hook (post-install / post-upgrade): reference data, subscription registration from
# AZURE_SUBSCRIPTIONS_CONFIG, and DEMO DATA only when DEMO_MODE=true. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-init
  labels:
    {{- include "acip.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.init.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "acip.selectorLabels" (dict "ctx" . "component" "init") | nindent 8 }}
        {{- include "acip.workloadIdentityLabel" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "acip.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: init
          image: {{ include "acip.image" (dict "ctx" . "component" "backend") }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["python", "-m", "app.cli", "init"]
          {{- include "acip.backendEnv" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            {{- include "acip.backendVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "acip.backendVolumes" . | nindent 8 }}
{{- end }}
