{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acip.serviceAccountName" . }}
  labels:
    {{- include "acip.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.serviceAccount.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.serviceAccount.workloadIdentity.tenantId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
