apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acip.fullname" . }}-config
  labels:
    {{- include "acip.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
---
{{- if .Values.subscriptionsConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acip.fullname" . }}-subscriptions
  labels:
    {{- include "acip.labels" . | nindent 4 }}
data:
  subscriptions.json: |
    {{- .Values.subscriptionsConfig.json | nindent 4 }}
{{- end }}
