{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "acip.fullname" . }}
  labels:
    {{- include "acip.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API (and its OpenAPI docs under /api/docs) goes straight to the backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "acip.fullname" . }}-backend
                port: { number: {{ .Values.backend.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "acip.fullname" . }}-frontend
                port: { number: {{ .Values.frontend.port }} }
{{- end }}
