{{- if .Values.keyVault.enabled }}
# Syncs the database URL from Azure Key Vault into the Kubernetes Secret referenced by
# DATABASE_URL. The CSI driver authenticates with Workload Identity (no secret in the cluster).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "acip.fullname" . }}-kv
  labels:
    {{- include "acip.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "acip.dbSecretName" . }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.databaseUrlSecretName }}
          key: {{ .Values.database.secretKey }}
        {{- if .Values.keyVault.smtpPasswordSecretName }}
        - objectName: {{ .Values.keyVault.smtpPasswordSecretName }}
          key: SMTP_PASSWORD
        {{- end }}
        {{- if .Values.keyVault.graphMailSecretName }}
        - objectName: {{ .Values.keyVault.graphMailSecretName }}
          key: GRAPH_MAIL_CLIENT_SECRET
        {{- end }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ include "acip.kvClientId" . | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.databaseUrlSecretName }}
          objectType: secret
        {{- if .Values.keyVault.smtpPasswordSecretName }}
        - |
          objectName: {{ .Values.keyVault.smtpPasswordSecretName }}
          objectType: secret
        {{- end }}
        {{- if .Values.keyVault.graphMailSecretName }}
        - |
          objectName: {{ .Values.keyVault.graphMailSecretName }}
          objectType: secret
        {{- end }}
{{- end }}
