# Staging: production-like, Entra sign-in enforced, real Azure exports.
config:
  APP_ENV: staging
  CORS_ORIGINS: "https://attcc-acip.stage.att.com"
  APP_PUBLIC_URL: "https://attcc-acip.stage.att.com"
  DEMO_MODE: "false"
  APP_AUTH_MODE: entra
backend:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
frontend:
  replicas: 2
keyVault:
  name: attcc-eastus2-stge-kv
  # Name of the certificate in Key Vault (rename if yours differs)
  tlsCertificateName: attcc-acip-stage-tls
ingress:
  host: attcc-acip.stage.att.com
  tls:
    secretName: attcc-acip-stage-tls
