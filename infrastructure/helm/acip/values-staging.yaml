# Staging: production-like, Entra sign-in enforced, real Azure exports.
config:
  APP_ENV: staging
  CORS_ORIGINS: "https://acip-staging.example.com"
  DEMO_MODE: "false"
  APP_AUTH_MODE: entra
backend:
  replicas: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
frontend:
  replicas: 2
keyVault:
  name: kv-acip-stg
ingress:
  host: acip-staging.example.com
  tls:
    secretName: acip-staging-tls
