---
# Source: acip/templates/frontend.yaml
apiVersion: v1
kind: Service
metadata:
  name: acip-frontend
  labels:
    helm.sh/chart: acip-1.0.0
    app.kubernetes.io/name: acip
    app.kubernetes.io/instance: acip
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: acip
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: acip
    app.kubernetes.io/instance: acip
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http

---
# Source: acip/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acip-frontend
  labels:
    helm.sh/chart: acip-1.0.0
    app.kubernetes.io/name: acip
    app.kubernetes.io/instance: acip
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: acip
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: acip
      app.kubernetes.io/instance: acip
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acip
        app.kubernetes.io/instance: acip
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: acip-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-side proxy target for /api/* (read at runtime; same image in every environment)
            - name: BACKEND_INTERNAL_URL
              value: "http://acip-backend:8000"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
