---
# Source: acip/templates/worker.yaml
# Ingestion worker: no Service (it only makes outbound calls to PostgreSQL and Azure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acip-worker
  labels:
    helm.sh/chart: acip-1.0.0
    app.kubernetes.io/name: acip
    app.kubernetes.io/instance: acip
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: acip
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: acip
      app.kubernetes.io/instance: acip
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acip
        app.kubernetes.io/instance: acip
        app.kubernetes.io/component: worker
        
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: 416fed14c2af49d80612e7f54d58e4721cc57c0927f131986c714552dc5d96b3
    spec:
      serviceAccountName: acip
      # SIGTERM lets the current job finish its transaction; unfinished jobs are re-queued as stale.
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: acip-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "worker.main"]
          envFrom:
            - configMapRef:
                name: acip-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: acip-db
                  key: DATABASE_URL
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: WORKER_HEARTBEAT_FILE
              value: /tmp/acip-worker-heartbeat
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            exec:
              command: ["python", "-m", "worker.healthcheck"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: exports
              mountPath: /data/exports
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: exports
          emptyDir:
            sizeLimit: 8Gi
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: acip-kv

