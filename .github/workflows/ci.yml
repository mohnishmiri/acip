name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acip
          POSTGRES_PASSWORD: acip_ci
          POSTGRES_DB: acip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acip" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://acip:acip_ci@localhost:5432/acip
      TEST_DATABASE_URL: postgresql+psycopg://acip:acip_ci@localhost:5432/acip_test
      DEMO_MODE: "false"
      APP_AUTH_MODE: disabled
      AZURE_AUTH_MODE: disabled
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app worker tests
      - run: pytest -q --cov=app --cov=worker --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for v in dev staging prod; do
            helm lint infrastructure/helm/acip -f infrastructure/helm/acip/values-$v.yaml
            helm template acip infrastructure/helm/acip -f infrastructure/helm/acip/values-$v.yaml > /dev/null
          done
      - run: az bicep build --file infrastructure/bicep/main.bicep --stdout > /dev/null

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: acip-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: acip-frontend:ci
